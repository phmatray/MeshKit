name: Generate pack

# Turns packs/<slug>.yaml into a sellable pack through the Meshy API, publishes the result as a
# GitHub Release asset (tag pack/<slug>/<run>), and optionally pushes it into a running store.
#
# Secrets:
#   MESHY_API_KEY         required — https://www.meshy.ai/settings/api
#   MESHKIT_INGEST_URL    optional — https://<store>/api/ingest   (only used when `publish` is true)
#   MESHKIT_INGEST_TOKEN  optional — the store's MeshKit__Ingest__Token
#
# Re-running the workflow for the same pack resumes: the previous release asset is restored first
# and models already generated are skipped (unless their prompt changed), so a partial failure only
# costs the models that failed. Tick `regenerate` to redo everything, e.g. after changing polycount
# or auto_size — the resume logic cannot see those.

on:
  workflow_dispatch:
    inputs:
      pack:
        description: "Pack slug (packs/<slug>.yaml)"
        required: true
        type: string
      publish:
        description: "Push the pack to the store (needs MESHKIT_INGEST_URL + MESHKIT_INGEST_TOKEN)"
        required: false
        type: boolean
        default: false
      concurrency:
        description: "Models generated in parallel"
        required: false
        type: number
        default: 2
      regenerate:
        description: "Redo every model, ignoring the previous release (needed after a generation-settings change; costs the full pack)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: generate-${{ inputs.pack }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PACK: ${{ inputs.pack }}
      RELEASE_TAG_PREFIX: pack/${{ inputs.pack }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the pack definition exists
        run: |
          test -f "packs/${PACK}.yaml" || { echo "::error::packs/${PACK}.yaml not found"; exit 1; }

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build pipeline
        run: dotnet build src/MeshKit.Pipeline -c Release

      - name: Restore previous output (resume)
        if: ${{ !inputs.regenerate }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p catalog dist
          latest=$(gh release list --json tagName --jq "[.[] | select(.tagName | startswith(\"${RELEASE_TAG_PREFIX}/\"))][0].tagName" 2>/dev/null || true)
          if [ -n "${latest}" ] && [ "${latest}" != "null" ]; then
            echo "Restoring ${latest}"
            gh release download "${latest}" --pattern "${PACK}.zip" --dir dist
            mkdir -p "catalog/${PACK}"
            unzip -q -o "dist/${PACK}.zip" -d "catalog/${PACK}"
            rm -f "dist/${PACK}.zip"
          else
            echo "No previous release for ${PACK}; starting from scratch"
          fi

      - name: Validate (dry run)
        run: dotnet run --project src/MeshKit.Pipeline -c Release --no-build -- generate --pack "packs/${PACK}.yaml" --out catalog --dry-run

      - name: Generate with Meshy
        id: generate
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
        run: |
          set +e
          dotnet run --project src/MeshKit.Pipeline -c Release --no-build -- \
            generate --pack "packs/${PACK}.yaml" --out catalog --concurrency "${{ inputs.concurrency }}" \
            ${{ inputs.regenerate && '--regenerate' || '' }}
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          # 1 = some models failed: still publish what exists so the next run resumes from it.
          if [ "${code}" -ne 0 ] && [ "${code}" -ne 1 ]; then exit "${code}"; fi

      - name: Zip pack
        run: dotnet run --project src/MeshKit.Pipeline -c Release --no-build -- zip --pack-dir "catalog/${PACK}" --out "dist/${PACK}.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: pack-${{ inputs.pack }}
          path: dist/${{ inputs.pack }}.zip
          retention-days: 30

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG_PREFIX}/${{ github.run_number }}"
          status="complete"
          [ "${{ steps.generate.outputs.exit_code }}" = "1" ] && status="PARTIAL — rerun to resume"
          gh release create "${tag}" "dist/${PACK}.zip" \
            --title "Pack ${PACK} #${{ github.run_number }}" \
            --notes "Generated by run ${{ github.run_id }} · ${status}" \
            --latest=false

      - name: Publish to store
        if: ${{ inputs.publish && steps.generate.outputs.exit_code == '0' }}
        env:
          MESHKIT_INGEST_URL: ${{ secrets.MESHKIT_INGEST_URL }}
          MESHKIT_INGEST_TOKEN: ${{ secrets.MESHKIT_INGEST_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MESHKIT_INGEST_URL}" ] || [ -z "${MESHKIT_INGEST_TOKEN}" ]; then
            echo "::warning::publish requested but MESHKIT_INGEST_URL / MESHKIT_INGEST_TOKEN secrets are not set; skipping"
            exit 0
          fi
          dotnet run --project src/MeshKit.Pipeline -c Release --no-build -- publish --zip "dist/${PACK}.zip" --url "${MESHKIT_INGEST_URL}"

      - name: Fail if models failed
        if: ${{ steps.generate.outputs.exit_code == '1' }}
        run: |
          echo "::error::Some models failed; the partial pack was published as a release asset. Re-run this workflow to resume."
          exit 1
