# MeshKit — one service, two bind-mounted directories.
#
#   cp .env.example .env   # fill in the Stripe keys, public URL and ingest token
#   mkdir -p data catalog && sudo chown -R 1001:1001 data catalog   # the container runs as uid 1001
#   docker compose up -d
#
# Put TLS in front with your usual reverse proxy (Caddy, nginx, Traefik); the app trusts
# X-Forwarded-* headers. Packs land in ./catalog — from the pipeline (POST /api/ingest) or by
# unzipping a release asset there and restarting.

services:
  web:
    image: ghcr.io/phmatray/meshkit:${MESHKIT_TAG:-latest}
    build: .
    container_name: meshkit
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__AppDb: "Data Source=/app/data/meshkit.db"
      DataProtection__KeysPath: /app/data/keys
      MeshKit__Catalog__Path: /app/catalog
    ports:
      - "${MESHKIT_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
      - ./catalog:/app/catalog
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Local development only: forwards Stripe test events to the web container.
  #   docker compose --profile dev run --rm stripe-cli listen --print-secret   # -> STRIPE__WEBHOOKSECRET
  #   docker compose --profile dev up -d
  stripe-cli:
    image: stripe/stripe-cli:latest
    profiles: [dev]
    restart: unless-stopped
    environment:
      STRIPE_API_KEY: ${STRIPE_CLI_API_KEY:-}
      STRIPE_DEVICE_NAME: meshkit-compose
    command: ["listen", "--forward-to", "http://web:8080/stripe/webhook", "--events", "checkout.session.completed,checkout.session.async_payment_succeeded,checkout.session.async_payment_failed"]
    depends_on:
      web:
        condition: service_healthy
