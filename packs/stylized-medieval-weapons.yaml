slug: stylized-medieval-weapons
name: Stylized Medieval Weapons
description: >-
  Eight game-ready medieval weapons and shields in a chunky stylized look with hand-painted-style
  PBR textures — a starter armoury for any RPG or action prototype. GLB, FBX, OBJ and USDZ included.
tags: [weapons, medieval, fantasy, rpg, game-asset, armoury]
category: weapons
style: stylized
license:
  id: meshkit-standard
sample: dagger                  # free for any account — "try before you buy"
# Orientation matters to auto_size: Meshy sizes by HEIGHT, so a blade generated lying flat gets its
# thickness scaled to the declared length (the first run produced an 80 m dagger). Weapons are
# therefore prompted standing upright with the length along the vertical axis.
price:
  amount: 1900
  currency: eur
generation:
  ai_model: latest                 # resolves to Meshy 7
  model_type: standard             # 'lowpoly' is deprecated by Meshy
  should_remesh: true              # without it Meshy IGNORES target_polycount (the first run shipped a 22k-tri campfire)
  topology: triangle               # what the store counts; 'quad' for artist-friendly editing meshes
  target_polycount: 5000
  auto_size: true                  # real-world scale: a chest is chest-sized in the engine, not 1.9 m wide
  origin_at: bottom                # floor-level pivot, the game-ready convention
  alpha_thumbnail: true            # transparent renders for the store cards
  ultra_mode: false                # +5 credits/model; switched on per hero model below with `ultra: true`
  lods: [2500, 1000]                # Meshy Remesh of the refined model, 5 credits per level; shipped as lod1/lod2 next to the full model
  enable_pbr: true
  texture_resolution: 2k
  target_formats: [glb, fbx, obj, usdz]
  preview: textured
variants:                        # Meshy Retexture of every model, 10 credits per model and variant; shown as skins in the viewer
  - slug: ornate
    name: Ornate
    prompt: royal ornate finish, gold filigree and engraving, polished steel, deep blue and crimson accents
  - slug: battle-worn
    name: Battle-worn
    prompt: scratched, dented and chipped, dull rusted steel, dirty worn leather, faded paint
models:
  - slug: longsword
    name: Longsword
    ultra: true
    prompt: a medieval longsword standing upright with the blade pointing up, straight double-edged blade, cross guard and leather-wrapped grip, about 1.1 m tall, stylized game asset, chunky proportions
    texture_prompt: polished steel blade, dark brown leather grip, brass pommel
    tags: [sword, blade, steel, knight]
  - slug: battle-axe
    name: Battle Axe
    prompt: a one-handed medieval battle axe standing upright with the haft vertical and the curved steel head at the top, about 70 cm tall, stylized game asset, chunky proportions
    texture_prompt: weathered steel head, dark oak haft with leather strapping
    tags: [axe, blade, wood, warrior]
  - slug: war-hammer
    name: War Hammer
    prompt: a medieval war hammer with a square steel head and a back spike on a long wooden handle, about 90 cm long, stylized game asset, chunky proportions
    tags: [hammer, blunt, steel, knight]
  - slug: round-shield
    name: Round Shield
    prompt: a round wooden shield with a central iron boss and riveted metal rim, about 80 cm across, stylized game asset, chunky proportions
    texture_prompt: painted wooden planks with a red and cream spiral pattern, iron boss
    tags: [shield, round, wood, viking]
  - slug: kite-shield
    name: Kite Shield
    prompt: a tall medieval kite shield with a pointed bottom and a painted heraldic lion emblem, about 1.1 m tall, stylized game asset, chunky proportions
    texture_prompt: blue field with a gold lion emblem, steel rim
    tags: [shield, kite, heraldry, knight]
  - slug: recurve-bow
    name: Recurve Bow
    prompt: a wooden recurve bow with a wrapped grip and a taut string, about 1.5 m tall, stylized game asset, chunky proportions
    tags: [bow, ranged, archer, wood]
  - slug: dagger
    name: Dagger
    prompt: a short medieval dagger standing upright with the blade pointing up, leaf-shaped blade and a small crossguard, about 35 cm tall, stylized game asset, chunky proportions
    texture_prompt: bright steel blade, black leather grip with a red gem in the pommel
    tags: [dagger, knife, blade, rogue]
  - slug: wooden-staff
    name: Wooden Staff
    prompt: a gnarled wooden wizard staff topped with a crystal held by twisted branches, about 1.8 m tall, stylized game asset, chunky proportions
    texture_prompt: dark twisted wood, glowing purple crystal
    tags: [staff, magic, wizard, crystal, wood]
